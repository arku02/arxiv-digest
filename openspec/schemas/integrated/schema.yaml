name: integrated
version: 1
description: Product intent, behavior, design, tasks, review, verified delivery
artifacts:
  - id: proposal
    generates: proposal.md
    description: Product intent, scope, non-goals and source references
    template: proposal.md
    instruction: |
      Use the local template. Apply BMAD-inspired problem and scope analysis.
      Label assumptions. A small change may reference an existing PRD.
    requires: []
  - id: specs
    generates: "specs/**/*.md"
    description: Observable behavior and acceptance scenarios
    template: spec.md
    instruction: |
      Define WHAT, not internal implementation. Use stable R IDs in requirement titles.
      Use full ADDED/MODIFIED/REMOVED requirement blocks and WHEN/THEN scenarios.
      MVP requires a behavior delta; do not invent one for documentation-only work.
    requires: [proposal]
  - id: design
    generates: design.md
    description: Evidence, proposed approach and technical decisions
    template: design.md
    instruction: |
      Apply BMAD-inspired architecture assessment against actual code.
      Separate facts, assumptions and proposed decisions. Reference durable ADRs.
      Small changes keep all headings but may explain why a section is not applicable.
    requires: [proposal]
  - id: tasks
    generates: tasks.md
    description: Sole implementation and verification checklist
    template: tasks.md
    instruction: |
      Use numbered checkboxes. Link every task to a requirement or technical check.
      Resolve consequential ambiguity before implementation.
    requires: [specs, design]
  - id: review
    generates: review.md
    description: Clarification, coverage and evidence record
    template: review.md
    instruction: |
      Apply Spec Kit-inspired clarification and consistency checks.
      Inspect requirements, design and tasks; do not merely count files.
      Set decision ready only after substantive review; unresolved questions block ready.
      Link every requirement and task to an existing planned test path.
      Test evidence is generated by scripts/workflow.mjs verify, never fabricated.
    requires: [specs, design, tasks]
apply:
  requires: [tasks, review]
  tracks: tasks.md
  instruction: |
    First run node scripts/workflow.mjs check <change>.
    Implement only the authorized change and update the sole tasks.md.
    Run node scripts/workflow.mjs verify <change> after completing tasks.
    Finish only with node scripts/workflow.mjs archive <change>.
    Raw OpenSpec archive bypasses the local evidence gate and is not an approved delivery path.

